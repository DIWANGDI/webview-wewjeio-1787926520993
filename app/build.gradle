plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baiduapp.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.baiduapp.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
